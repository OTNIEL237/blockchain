<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sgcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58e192"/>
      <stop offset="100%" stop-color="#29a060"/>
    </linearGradient>
    <filter id="sgcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#26664a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle with subtle noise texture -->
  <g filter="url(#sgcShadow)">
    <circle cx="100" cy="100" r="92" fill="url(#sgcGradient)"/>
  </g>

  <!-- Icon mark: stylized S formed by two interlocking shapes -->
  <g transform="translate(100,100)">
    <path d="M -30 -40 C -10 -60, 30 -60, 30 -40 C 30 -20, -10 -20, -30 0 C -50 20, -10 40, 10 40 C 40 40, 60 20, 60 0"
          fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <path d="M -30 -15 C -10 -35, 30 -35, 30 -15 C 30 5, -10 5, -30 25 C -50 45, -10 60, 10 60 C 40 60, 70 40, 70 20"
          fill="none" stroke="#BFF6D9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Central emblem: shield-like shape behind the S -->
    <path d="M -42 10 L -24 -54 L 24 -54 L 42 10 L 0 72 Z" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Wordmark (small) -->
  <text x="100" y="178" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff" opacity="0.9" font-family="Inter, Arial, sans-serif">Sango Coin</text>
</svg>