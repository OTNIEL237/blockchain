<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ethGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#627EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C63D2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#ethGradient)"/>
  <g transform="translate(100, 50)">
    <!-- Ethereum symbol (diamond) -->
    <polygon points="0,-40 30,0 0,25 -30,0" fill="white"/>
    <polygon points="0,25 30,50 0,75 -30,50" fill="white" opacity="0.8"/>
  </g>
