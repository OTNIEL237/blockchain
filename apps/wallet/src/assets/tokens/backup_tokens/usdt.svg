<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="usdtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26A17B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E8B5F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#usdtGradient)"/>
  <!-- USDT text -->
  <text x="100" y="75" font-size="35" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">USDT</text>
  <!-- Dollar sign -->
  <g transform="translate(100, 115)">
    <text x="0" y="25" font-size="50" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">$</text>
  </g>
</svg>